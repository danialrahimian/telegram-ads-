name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/danialrahimian/telegram-ads

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyflakes
      - name: Lint Python
        run: python -m pyflakes app tests
      - name: Lint shell
        run: shellcheck -S warning install.sh tests/run_e2e.sh
      - name: End-to-end test against a fake Telegram Ads API
        run: bash tests/run_e2e.sh

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **Install:**
          \`\`\`
          sudo bash -c "\$(curl -fsSL https://github.com/${GITHUB_REPOSITORY}/raw/main/install.sh)" @ install
          \`\`\`
          **Update an existing server to this version:** \`psychonet-ads update --version ${GITHUB_REF_NAME}\`

          Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\`
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release was created in the GitHub UI: keep its text and add the install notes on top.
            { cat notes.md; echo; gh release view "$GITHUB_REF_NAME" --json body --jq .body; } > merged.md
            gh release edit "$GITHUB_REF_NAME" --notes-file merged.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          fi
